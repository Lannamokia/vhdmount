; Repository-tracked default template for VHDMounter.
; Override these values locally per machine after deployment when needed.

[Settings]
; 服务端 URL 前缀。客户端会基于这个前缀自行拼接固定端点：
; /api/boot-image-select
; /api/evhd-envelope
; /api/protect
; /ws/machine-log
ServerBaseUrl=http://127.0.0.1:8080

; 是否启用远程VHD选择功能 (true/false)
EnableRemoteSelection=false

; 预配置注册证书（PFX）路径，用于签名机台公钥注册请求
RegistrationCertificatePath=

; 预配置注册证书密码
RegistrationCertificatePassword=

; 机台ID (用于识别当前机台)
MachineId=MACHINE_001

; 是否启用保护检查功能 (true/false)
EnableProtectionCheck=false

; 保护检查间隔 (毫秒)
ProtectionCheckInterval=500

; 是否启用机台日志上报
EnableLogUpload=false

; 机台日志上传批间隔（毫秒）
MachineLogUploadIntervalMs=3000

; 机台日志每批最多上传条数
MachineLogUploadBatchSize=200

; 机台日志本地待上传 spool 最大字节数
MachineLogUploadMaxSpoolBytes=52428800

; 游戏内容更新（option 目录下发）超时时间（分钟）
GameContentUpdateTimeout=10

; ===================== RustDesk 桥（rustdesk-bridge-host feature）=====================
; 启用 RustDesk 桥（true/false）。默认关闭，便于既有部署不受影响。
EnableRustDeskBridge=false

; Bridge_Policy_Signing_Pubkey PEM 路径（决策点 7 的本地缓存槽）。
; 留空则首次启动时从 GET /api/machines/:machineId/rustdesk/policy-pubkey 拉取 并落盘。
BridgePolicyPubkeyPath=

; Trusted_Controllers_Snapshot 拉取周期（秒）。
; 启动期读取，运行期不可热改。允许范围 60-600。
SnapshotPullIntervalSeconds=300

; Report 上报到 VHDSelectServer 的 HTTP 超时（毫秒）。
ReportUpstreamTimeoutMs=5000

; 重试队列容量（条）。
ReportRetryQueueCapacity=64

; Bridge_Server 服务端进程内 Handshake_Nonce_LRU 的并发服务客户端数 N。
; 默认 1（典型 1:1 部署）；整合服务多台被控主机时由运维方提升。
HandshakeNonceLruClientCount=1

; Revocation 反向通道（决策点 4）的本地 HTTP 监听端口。
; 仅 loopback 监听；生产环境需要 Windows 防火墙规则禁止公网访问。
BridgeRevocationListenPort=7891
